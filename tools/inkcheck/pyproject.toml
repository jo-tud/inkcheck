[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "inkcheck"
version = "0.1.0"
description = "CPU harness that reproduces the published PHerc. 343 First Letters ink result; parts for diagnosing why ink detection comes up empty on a Vesuvius Challenge surface patch."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "tifffile>=2024.8",
    "requests>=2.32",
]

[project.optional-dependencies]
ink = ["torch>=2.4"]
tests = ["pytest>=8"]

[project.scripts]
inkcheck = "inkcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
